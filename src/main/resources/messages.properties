# Delivery 관련
DELIVERY.NOT_FOUND=배송을 찾을 수 없습니다
DELIVERY.CANCEL_FAILED=배송을 취소할 수 없습니다
DELIVERY.INVALID_STATUS=유효하지 않은 배송 상태입니다
DELIVERY.ALREADY_COMPLETED=이미 완료된 배송입니다
DELIVERY.ALREADY_CANCELED=이미 취소된 배송입니다

# DeliveryHistory 관련
DELIVERY.HISTORY_NOT_FOUND=배송 기록을 찾을 수 없습니다
DELIVERY.HISTORY_INVALID_STATUS=유효하지 않은 배송 기록 상태입니다
DELIVERY.HISTORY_INVALID_SEQUENCE=유효하지 않은 배송 순서입니다

# 상태 전이 관련
DELIVERY.INVALID_STATUS_TRANSITION=유효하지 않은 상태 전이입니다
DELIVERY.HUB_DELIVERY_NOT_AVAILABLE=허브 배송 대기 상태에서만 허브 배송을 시작할 수 있습니다
DELIVERY.COMPANY_DELIVERY_NOT_AVAILABLE=목적지 허브 도착 상태에서만 업체 배송을 시작할 수 있습니다
DELIVERY.COMPLETION_NOT_AVAILABLE=업체 배송 중일 때만 배송을 완료할 수 있습니다

# 배송 담당자 관련
DELIVERY.MANAGER_NOT_ASSIGNED=배송 담당자가 배정되지 않았습니다
DELIVERY.MANAGER_ALREADY_ASSIGNED=이미 배송 담당자가 배정되었습니다

# 유효성 검사
DELIVERY.INVALID_ADDRESS=유효하지 않은 배송지 주소입니다
DELIVERY.INVALID_HUB=유효하지 않은 허브입니다
